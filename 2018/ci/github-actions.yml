# BARR-C:2018 conformance gate for GitHub Actions
# Runs check.sh so CI and the local check are one code path.
name: barr-c-2018
on: [push, pull_request]
jobs:
  conformance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM tools (pinned; clang-tidy 17+ required)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18 clang-tidy-18
          sudo ln -sf /usr/bin/clang-format-18 /usr/local/bin/clang-format
          sudo ln -sf /usr/bin/clang-tidy-18 /usr/local/bin/clang-tidy
      - name: BARR-C gates
        run: sh ./check.sh
